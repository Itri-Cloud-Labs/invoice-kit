name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  typescript:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/typescript/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: packages/typescript

      - name: Typecheck
        run: npm run typecheck
        working-directory: packages/typescript

      - name: Build
        run: npm run build
        working-directory: packages/typescript

      - name: Unit tests
        run: npm run test:unit
        working-directory: packages/typescript

      - name: Smoke test
        run: npm run smoke
        working-directory: packages/typescript

      - name: Pack dry run
        run: npm pack --dry-run
        working-directory: packages/typescript

  python:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.14"
          enable-cache: true
          cache-dependency-glob: packages/python/uv.lock

      - name: Setup Python
        run: uv python install "${{ matrix.python-version }}"

      - name: Install dependencies
        working-directory: packages/python
        run: uv sync --frozen --python "${{ matrix.python-version }}"

      - name: Lint and format
        if: matrix.python-version == '3.12'
        working-directory: packages/python
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typecheck
        if: matrix.python-version == '3.12'
        working-directory: packages/python
        run: uv run mypy src

      - name: Unit tests
        working-directory: packages/python
        run: uv run pytest

      - name: Smoke test
        working-directory: packages/python
        run: uv run python smoke_test.py

      - name: Build and inspect distributions
        working-directory: packages/python
        run: |
          uv build
          uv run twine check dist/*

      - name: Install wheel and sdist
        working-directory: packages/python
        run: |
          uv venv "$RUNNER_TEMP/wheel-env" --python "${{ matrix.python-version }}"
          uv pip install --python "$RUNNER_TEMP/wheel-env/bin/python" dist/*.whl
          "$RUNNER_TEMP/wheel-env/bin/python" -c "from invoice_kit import create_invoice; assert create_invoice().to_pdf().startswith(b'%PDF-')"
          uv venv "$RUNNER_TEMP/sdist-env" --python "${{ matrix.python-version }}"
          uv pip install --python "$RUNNER_TEMP/sdist-env/bin/python" dist/*.tar.gz
          "$RUNNER_TEMP/sdist-env/bin/python" -c "import invoice_kit; assert invoice_kit.create_invoice"
