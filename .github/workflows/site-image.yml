name: Site image

on:
  push:
    branches:
      - main
    paths:
      - site/**
      - packages/typescript/src/**
      - packages/typescript/package.json
      - Dockerfile
      - .dockerignore
      - .github/workflows/site-image.yml
  pull_request:
    paths:
      - site/**
      - packages/typescript/src/**
      - packages/typescript/package.json
      - Dockerfile
      - .dockerignore
      - .github/workflows/site-image.yml
  workflow_dispatch:

concurrency:
  group: site-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}-site

jobs:
  image:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Blacksmith Docker builder
        uses: useblacksmith/setup-docker-builder@v2

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=invoice-kit site
            org.opencontainers.image.description=Marketing site for invoice-kit

      # Pull requests build the image to prove it still builds, without publishing it.
      - name: Build and push
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
