name: Release Reminder

on:
  push:
    branches:
      - main

jobs:
  remind-versioning:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: ${{ !contains(github.event.head_commit.message, 'chore(release)') }}

    steps:
      - name: Versioning note
        run: |
          echo "Publish workflow is enabled on push to main."
          echo "If package.json version is unchanged from npm, publish will be skipped."
