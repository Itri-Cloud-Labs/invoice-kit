[build-system]
requires = ["hatchling>=1.27,<1.29"]
build-backend = "hatchling.build"

[project]
name = "ic-labs-invoice-kit"
version = "0.1.0"
description = "Typed Python library for generating Moroccan business documents as PDFs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Itri Cloud Labs" }]
keywords = ["invoice", "pdf", "morocco", "arabic"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "fpdf2>=2.8.4,<3",
  "httpx>=0.28,<1",
  "pillow>=11,<13",
  "typing-extensions>=4.14,<5",
  "uharfbuzz>=0.50,<1",
]

[project.urls]
Homepage = "https://github.com/Itri-Cloud-Labs/invoice-kit"
Issues = "https://github.com/Itri-Cloud-Labs/invoice-kit/issues"
Repository = "https://github.com/Itri-Cloud-Labs/invoice-kit"

[dependency-groups]
dev = [
  "build>=1.3,<2",
  "mypy>=1.17,<2",
  "packaging>=25,<27",
  "pypdf>=6,<7",
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  "twine>=6.1,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_kit"]

[tool.hatch.build.targets.sdist]
include = ["src/invoice_kit", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.hatch.build]
artifacts = ["src/invoice_kit/fonts/*.ttf", "src/invoice_kit/fonts/*.txt", "src/invoice_kit/py.typed"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["invoice_kit"]
